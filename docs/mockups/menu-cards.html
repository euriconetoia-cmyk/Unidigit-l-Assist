<!doctype html><meta charset="utf-8"><title>Mockup · menu em cards</title>
<style>
:root{--p:#0b5cad;--t:#1b2430;--m:#5b6676;--b:#d9dfe7}
*{box-sizing:border-box}body{margin:0;width:1000px;height:700px;font:14px system-ui,sans-serif;color:var(--t);background:#eef1f5;position:relative;overflow:hidden}
.pg{padding:24px;color:#8a94a3}.pg h2{margin:0 0 8px}.l{height:14px;background:#dfe4ea;border-radius:7px;margin:10px 0;width:60%}
.tab{position:absolute;right:0;bottom:104px;width:48px;height:56px;background:var(--p);border-radius:10px 0 0 10px;display:grid;place-items:center}
.tab svg{width:24px;height:24px;fill:none;stroke:#fff;stroke-width:1.8}
.ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:#e6f0fa;color:var(--p)}.ic svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.card b{display:block;font-size:14px}.card small{color:var(--m);font-size:12px;line-height:1.3;display:block}
/* A: popover em grade */
.A{position:absolute;right:60px;bottom:96px;width:420px;background:#fff;border-radius:16px;box-shadow:0 10px 32px #0004;padding:14px}
.A h4{margin:2px 4px 8px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--m)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.A .card{border:1px solid var(--b);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;background:#fff}
.A .card.wide{grid-column:span 2;flex-direction:row;align-items:center}
.A .card.off{border-style:dashed;opacity:.65}.tag{font-size:11px;background:#e8ebf0;border-radius:9px;padding:1px 8px;color:var(--m);margin-left:auto}
.A .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.A .hd b{font-size:15px}
.x{width:28px;height:28px;border-radius:8px;border:1px solid var(--b);display:grid;place-items:center;color:var(--m)}
/* B: cards soltos em leque */
.B{position:absolute;right:60px;bottom:96px;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.B .card{display:flex;gap:12px;align-items:center;background:#fff;border-radius:14px;padding:10px 14px;width:290px;box-shadow:0 6px 18px #0003}
.B .card.off{opacity:.65}
.cap{position:absolute;left:24px;bottom:24px;background:#fff;border-radius:8px;padding:8px 12px;color:var(--m);font-size:12px}
</style>
<body>
<div class="pg"><h2>Moodle — Curso Técnico em Redes (EaD)</h2><div class="l"></div><div class="l" style="width:40%"></div></div>
<div class="tab"><svg viewBox="0 0 24 24"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c3 2.5 9 2.5 12 0v-5"/></svg></div>
<div id="r"></div>
<script>
const I={pend:'<circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/>',corr:'<path d="M4 20l4-1 11-11-3-3L5 16zM14 6l3 3"/>',acomp:'<path d="M4 19V5M4 19h16M8 15l4-4 3 3 5-6"/>',alun:'<circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M17 11a3 3 0 1 0 0-6M21 20c0-2.5-1.6-4.6-4-5.5"/>',rel:'<path d="M5 20V10M12 20V4M19 20v-7"/>',blo:'<rect x="3" y="4" width="8" height="6" rx="1.5"/><rect x="13" y="14" width="8" height="6" rx="1.5"/><path d="M7 10v4h6"/>'};
const ic=k=>`<span class="ic"><svg viewBox="0 0 24 24">${I[k]}</svg></span>`;
const c=(k,n,d,cls='')=>`<div class="card ${cls}">${ic(k)}<div><b>${n}</b><small>${d}</small></div>${cls.includes('off')?'<span class="tag">em breve</span>':''}</div>`;
const v=location.hash.slice(1)||'A';
document.getElementById('r').innerHTML = v=='A' ? `<div class="A"><div class="hd"><b>Ferramentas EaD</b><span class="x">✕</span></div>
<h4>Correção</h4><div class="grid">${c('pend','Pendências','Buscar o que falta corrigir')}${c('corr','Correção','Lançar notas por CSV')}</div>
<h4>Alunos</h4><div class="grid">${c('acomp','Acompanhamento','Alunos em risco e próxima ação')}${c('alun','Alunos e notas','Lista e boletim')}${c('rel','Relatório da UC','Desempenho geral da turma','wide')}</div>
<h4>Em breve</h4><div class="grid">${c('blo','Automação por blocos','Montar rotinas','wide off')}</div></div>
<div class="cap">Versão A · grade de cards agrupada, ancorada ao botão</div>`
: `<div class="B">${c('rel','Relatório da UC','Desempenho geral')}${c('alun','Alunos e notas','Lista e boletim')}${c('acomp','Acompanhamento','Alunos em risco')}${c('corr','Correção','Lançar notas por CSV')}${c('pend','Pendências','Buscar o que falta corrigir')}${c('blo','Automação por blocos','em breve','off')}</div>
<div class="cap">Versão B · cards soltos em leque saindo do botão (um por ferramenta)</div>`;
</script>
