<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Mockup · Alunos, Acompanhamento e Relatório da UC</title>
<style>
:root{--p:#0b5cad;--bg:#f4f6f9;--s:#fff;--t:#1b2430;--m:#5b6676;--b:#d9dfe7;--ok:#1b7f3b;--warn:#b26a00;--bad:#c0392b;--imm:#8e1b1b}
*{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif;color:var(--t);background:#cfd6df;width:1180px;height:760px;position:relative;overflow:hidden}
.page{position:absolute;inset:0 520px 0 0;background:#eef1f5;padding:24px;color:#8a94a3}
.page h2{margin:0 0 8px;font-weight:600}.page .l{height:14px;background:#dfe4ea;border-radius:7px;margin:10px 0;width:70%}
.tab{position:absolute;right:660px;bottom:104px;width:48px;height:56px;background:var(--p);border-radius:10px 0 0 10px;display:grid;place-items:center}
.drawer{position:absolute;top:0;right:0;bottom:0;width:660px;background:var(--bg);box-shadow:-6px 0 24px #0003;display:flex;flex-direction:column}
.tab{right:660px}
header{background:var(--p);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px}
header b{font-size:16px;flex:1}header small{opacity:.85}
.ib{width:40px;height:40px;border-radius:8px;border:1px solid #fff6;background:#ffffff1f;color:#fff;display:grid;place-items:center;font-size:18px}
nav{display:flex;gap:4px;background:var(--s);border-bottom:1px solid var(--b);padding:0 12px}
nav span{padding:12px 14px;color:var(--m);border-bottom:3px solid transparent}nav .on{color:var(--p);border-color:var(--p);font-weight:600}
.bar{display:flex;gap:8px;align-items:center;padding:12px 16px;background:var(--s);border-bottom:1px solid var(--b)}
.bar .f{flex:1;height:40px;border:1px solid var(--b);border-radius:8px;padding:0 12px;display:flex;align-items:center;color:var(--m)}
.bar .btn{height:40px;min-width:40px;border-radius:8px;border:1px solid var(--b);display:grid;place-items:center;background:#fff;padding:0 10px;color:var(--p);font-weight:600}
.bar .pri{background:var(--p);color:#fff;border-color:var(--p)}
.cov{padding:8px 16px;font-size:12.5px;color:var(--m);display:flex;gap:14px;align-items:center}
.cov i{font-style:normal;background:#e3f1e8;color:var(--ok);padding:2px 8px;border-radius:10px;font-weight:600}
.body{padding:12px 16px;overflow:hidden;flex:1}
table{width:100%;border-collapse:collapse;background:var(--s);border:1px solid var(--b);border-radius:8px;overflow:hidden}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid #edf0f4;font-size:13px}th{background:#f1f4f8;color:var(--m);font-weight:600;font-size:12px}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:2px 9px;border-radius:10px;font-size:12px;font-weight:600}
.reg{background:#e3f1e8;color:var(--ok)}.at{background:#fff1d6;color:var(--warn)}.al{background:#fde0dc;color:var(--bad)}.im{background:var(--imm);color:#fff}.nv{background:#e8ebf0;color:var(--m)}
.low{color:var(--bad);font-weight:600}.blank{color:#aab2bf}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.card{background:var(--s);border:1px solid var(--b);border-radius:8px;padding:12px}.card b{font-size:22px;display:block}.card span{color:var(--m);font-size:12px}
.sec{font-weight:600;margin:14px 0 8px}
.why{color:var(--m);font-size:12px;display:block}
.bars{display:flex;height:22px;border-radius:6px;overflow:hidden;margin-bottom:6px}.bars i{display:block}
.legend{display:flex;gap:14px;font-size:12px;color:var(--m)}.legend u{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;text-decoration:none}
.row{display:grid;grid-template-columns:200px 1fr 70px;gap:10px;align-items:center;margin:7px 0;font-size:13px}.track{height:14px;background:#e6eaf0;border-radius:7px;overflow:hidden}.track i{display:block;height:100%;background:var(--p)}
.menu{position:absolute;right:0;bottom:168px;width:300px;background:#fff;border-radius:12px;box-shadow:0 8px 28px #0004;padding:6px}
.menu div{padding:11px 12px;border-radius:8px;display:flex;justify-content:space-between}.menu .new{background:#eaf2fb}.menu small{color:var(--m)}
.tag{background:#e8ebf0;color:var(--m);border-radius:9px;padding:1px 8px;font-size:11px}
</style>
<body>
<div class="page"><h2>Moodle — Curso Técnico em Redes (EaD)</h2><div class="l"></div><div class="l" style="width:50%"></div><div class="l"></div></div>
<div class="tab"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c3 2.5 9 2.5 12 0v-5"/></svg></div>
<div id="root"></div>
<script>
const alunos=[
["Ana Beatriz Souza","hoje",100,92,"regular"],["Bruno Henrique Lima","2 dias",88,81,"regular"],["Camila Ferreira","9 dias",67,58,"atencao"],
["Diego Martins","16 dias",44,47,"alto"],["Eduarda Nogueira","1 dia",96,88,"regular"],["Fábio Rocha","23 dias",22,31,"imediato"],["Gabriela Alves","5 dias",78,74,"regular"],["Heitor Santos","12 dias",56,52,"alto"]];
const pill=r=>({regular:'<span class="pill reg">Regular</span>',atencao:'<span class="pill at">Atenção</span>',alto:'<span class="pill al">Alto</span>',imediato:'<span class="pill im">Imediato</span>'}[r]);
const shell=(tab,inner,extra='')=>`<div class="drawer"><header><span class="ib" style="font-size:16px">←</span><div style="flex:1"><b>Alunos e notas</b><br><small>Redes de Computadores · UC Serviços de Redes · 01/09 a 30/11</small></div><span class="ib">↻</span><span class="ib">✕</span></header>
<nav>${['Alunos','Notas','Acompanhamento','Relatório da UC'].map(t=>`<span class="${t==tab?'on':''}">${t}</span>`).join('')}</nav>${inner}</div>`;
const cov='<div class="cov"><i>Leitura completa</i> 40 de 40 alunos · 12 atividades · lida hoje 14:32 <span style="margin-left:auto">Dados só neste navegador</span></div>';
const screens={
menu:`<div class="menu"><div>Pendências <small>radar</small></div><div>Correção <small>lote CSV</small></div><div class="new"><b>Acompanhamento</b><small>risco por aluno</small></div><div class="new"><b>Alunos e notas</b><small>lista e boletim</small></div><div class="new"><b>Relatório da UC</b><small>desempenho geral</small></div><div style="color:#8a94a3">Automação por blocos <span class="tag">em breve</span></div></div>`,
alunos:shell('Alunos',`<div class="bar"><div class="f">🔍 Buscar aluno ou e-mail</div><span class="btn">Todos ▾</span><span class="btn pri">↻ Ler</span><span class="btn">⬇ CSV</span></div>${cov}<div class="body"><table><tr><th>Aluno</th><th>Último acesso</th><th class="n">Entregas</th><th class="n">Nota total</th><th>Situação</th></tr>${alunos.map(a=>`<tr><td>${a[0]}</td><td>${a[1]}</td><td class="n">${Math.round(a[2]*12/100)}/12</td><td class="n ${a[3]<60?'low':''}">${a[3]}</td><td>${a[3]>=60?'<span class="pill reg">Média alcançada</span>':a[3]>=40?'<span class="pill at">Recuperação</span>':'<span class="pill al">Abaixo da faixa</span>'}</td></tr>`).join('')}</table></div>`),
notas:shell('Notas',`<div class="bar"><div class="f">🔍 Buscar aluno</div><span class="btn">Só abaixo de 60</span><span class="btn">⬇ CSV</span><span class="btn">⬇ Excel</span></div>${cov}<div class="body"><table><tr><th>Aluno</th><th class="n">AV1</th><th class="n">AV2</th><th class="n">AV3</th><th class="n">AV4</th><th class="n">Projeto</th><th class="n">Total</th></tr>
${[["Ana Beatriz Souza",10,9,10,9,"54"],["Bruno Henrique Lima",9,8,"—",8,"46"],["Camila Ferreira",7,"—",6,5,"31"],["Diego Martins",5,4,"—","—","—"],["Fábio Rocha",3,"—","—","—","—"]].map((r,i)=>`<tr><td>${r[0]}</td>${[1,2,3,4].map(k=>`<td class="n ${r[k]=='—'?'blank':(r[k]<6?'low':'')}">${r[k]}</td>`).join('')}<td class="n ${r[5]=='—'?'blank':''}">${r[5]}</td><td class="n"><b>${[92,81,58,47,31][i]}</b></td></tr>`).join('')}
<tr><td><b>Média da turma</b></td><td class="n">7,4</td><td class="n">6,1</td><td class="n">6,8</td><td class="n">5,9</td><td class="n">38</td><td class="n"><b>65</b></td></tr></table>
<span class="why" style="margin-top:8px">“—” = sem nota lançada (não é zero). Nota máxima de cada item vem do boletim do Moodle.</span></div>`),
acomp:shell('Acompanhamento',`<div class="bar"><span class="btn">Todos os níveis ▾</span><span class="btn pri">↻ Ler</span><span class="btn">⬇ Lista de contato</span></div>${cov}<div class="body"><div class="cards"><div class="card"><b style="color:var(--imm)">1</b><span>Imediato</span></div><div class="card"><b style="color:var(--bad)">2</b><span>Alto</span></div><div class="card"><b style="color:var(--warn)">1</b><span>Atenção</span></div><div class="card"><b style="color:var(--ok)">36</b><span>Regular</span></div></div>
<table><tr><th>Aluno</th><th>Nível</th><th>Motivos e próxima ação</th></tr>
${[["Fábio Rocha","imediato","23 dias sem acesso · 4 sem entrega · nota 31","Contato hoje; UC encerra em 31 dias"],["Diego Martins","alto","16 dias sem acesso · 2 sem entrega","Enviar lembrete das entregas"],["Heitor Santos","alto","Nota 52 na recuperação · 12 dias sem acesso","Orientar recuperação"],["Camila Ferreira","atencao","9 dias sem acesso · 1 sem entrega","Acompanhar"]].map(a=>`<tr><td><b>${a[0]}</b></td><td>${pill(a[1])}</td><td>${a[2]}<span class="why">→ ${a[3]}</span></td></tr>`).join('')}</table>
<span class="why" style="margin-top:8px">Aluno com leitura incompleta aparece como <span class="pill nv">Verificar</span>, nunca como “regular”. “Contato registrado” não conta como entrega resolvida.</span></div>`),
rel:shell('Relatório da UC',`<div class="bar"><span class="btn">UC vigente ▾</span><span class="btn pri">↻ Ler</span><span class="btn">⬇ PDF</span><span class="btn">⬇ CSV</span></div>${cov}<div class="body"><div class="cards"><div class="card"><b>65</b><span>Média da turma</span></div><div class="card"><b>82%</b><span>Média alcançada</span></div><div class="card"><b>71%</b><span>Entregas feitas</span></div><div class="card"><b>7</b><span>A corrigir</span></div></div>
<div class="sec">Situação dos 40 alunos</div><div class="bars"><i style="width:72%;background:#2e9e56"></i><i style="width:10%;background:#e0a21a"></i><i style="width:13%;background:#d85b4b"></i><i style="width:5%;background:var(--imm)"></i></div>
<div class="legend"><span><u style="background:#2e9e56"></u>Média alcançada 29</span><span><u style="background:#e0a21a"></u>Recuperação 4</span><span><u style="background:#d85b4b"></u>Abaixo 5</span><span><u style="background:var(--imm)"></u>Sem nota 2</span></div>
<div class="sec">Desempenho por atividade (entrega · média)</div>
${[["AV1 · Fundamentos",96,"8,4"],["AV2 · Endereçamento",88,"7,1"],["AV3 · Serviços",74,"6,5"],["AV4 · Segurança",52,"5,9"]].map(r=>`<div class="row"><span>${r[0]}</span><div class="track"><i style="width:${r[1]}%"></i></div><span>${r[1]}% · ${r[2]}</span></div>`).join('')}
<span class="why">AV4 tem a menor entrega: bom ponto para reforço com a turma.</span></div>`)};
const h=(location.hash||'#alunos').slice(1);
document.getElementById('root').innerHTML=(h=='menu'?screens.menu:'')+(screens[h]&&h!='menu'?screens[h]:'');
if(h=='menu'){document.querySelector('.tab').style.right='0';document.querySelector('.page').style.inset='0'}
</script></body></html>
