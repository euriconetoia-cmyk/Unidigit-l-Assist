name: E2E (manual)

# Chromium real + Moodle simulado. Roda só quando você pedir (Actions → E2E → Run workflow).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Playwright global + Chromium
        run: |
          npm install -g playwright
          playwright install --with-deps chromium
      - name: Rodar e2e
        run: xvfb-run -a npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-prints
          path: /tmp/blocos-e2e-*
          if-no-files-found: ignore
