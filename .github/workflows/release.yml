name: Release

# Publica o ZIP da extensão quando uma tag de versão (vX.Y.Z) é enviada.
on:
  push:
    tags: ['v*']
  # Também dá para publicar sem terminal: Actions > Release > Run workflow.
  workflow_dispatch:
    inputs:
      versao:
        description: 'Tag da versão (ex.: v0.18.1). Deve bater com o manifest.json do commit.'
        required: true
      commit:
        description: 'Commit ou branch que vira a versão (vazio = main)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  publicar:
    name: Publicar versão
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TAG_ENTRADA: ${{ inputs.versao || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Conferir que a tag é a versão do manifesto
        run: |
          TAG="${TAG_ENTRADA}"
          versao="$(node -p "require('./manifest.json').version")"
          if [ "v${versao}" != "${TAG}" ]; then
            echo "A tag ${TAG} não bate com a versão do manifesto (${versao})." >&2
            exit 1
          fi
      - run: npm test
      - run: npm run build
      - run: npm run validate
      - run: npm run package
      - name: Notas da versão (trecho do CHANGELOG)
        run: |
          TAG="${TAG_ENTRADA}"
          versao="${TAG#v}"
          awk -v v="$versao" '$0 ~ "^## "v" " {p=1; next} /^## / && p {exit} p' CHANGELOG.md > notas.md
          [ -s notas.md ] || echo "Veja o CHANGELOG.md." > notas.md
      - name: Criar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${TAG_ENTRADA}"
          ALVO="$(git rev-parse HEAD)"
          # Se a release já foi criada pela página do GitHub, só anexa o ZIP e as notas; senão cria.
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" dist/*.zip --clobber
            gh release edit "${TAG}" --title "Unidigit@l Assist ${TAG}" --notes-file notas.md
          else
            gh release create "${TAG}" dist/*.zip --target "${ALVO}" --title "Unidigit@l Assist ${TAG}" --notes-file notas.md
          fi
